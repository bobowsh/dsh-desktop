name: Release desktop installers

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      windows_prerelease_tag:
        description: Optional non-v tag for a Windows Dev pre-release
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:

  windows-x64:
    name: Windows x64
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Set app version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version --no-git-tag-version --allow-same-version "${{ github.ref_name }}"
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Stage bundled user data (web profile plugins + mnemon CLI)
        shell: pwsh
        env:
          MNEMON_VERSION: '0.2.3'
        run: |
          # Install the web profile's bundled plugins into the REAL user home
          # (~/.dsh) and the Mnemon CLI into ~/.mnemon — the exact layout that
          # scripts/bundle-user-data.mjs snapshots from (it copies ~/.dsh +
          # ~/.mnemon into ./bundled-user-data, which electron-builder then
          # ships). This keeps the flow correct: bundle-user-data.mjs does the
          # staging, instead of us writing straight into bundled-user-data
          # (which made the snapshot script skip everything as "source not
          # found" on CI, where the home dir starts empty).
          #
          # pnpm v11 deny-by-default blocks build scripts of git-hosted/native
          # deps. The profile's pnpm-workspace.yaml sets dangerouslyAllowAllBuilds
          # (scoped to this plugin-bundling workspace; deps are version-pinned in
          # package.json). We seed that committed config into the real home so
          # pnpm reads the approval from ~/.dsh/profiles/web/pnpm-workspace.yaml.
          $srcProfile = Join-Path $env:GITHUB_WORKSPACE 'bundled-user-data\.dsh\profiles\web'
          $homeDsh = Join-Path $env:USERPROFILE '.dsh'
          $homeProfile = Join-Path $homeDsh 'profiles\web'
          New-Item -ItemType Directory -Force -Path $homeProfile | Out-Null
          # Seed the committed profile manifest + build-approval + lockfile into
          # the real home so pnpm installs reproducibly (frozen) and the approval
          # is in effect for the install that follows.
          Copy-Item "$srcProfile\package.json" "$homeProfile\package.json" -Force
          Copy-Item "$srcProfile\pnpm-workspace.yaml" "$homeProfile\pnpm-workspace.yaml" -Force
          Copy-Item "$srcProfile\pnpm-lock.yaml" "$homeProfile\pnpm-lock.yaml" -Force
          Push-Location $homeProfile
          pnpm install --frozen-lockfile
          Pop-Location

          # Fetch the prebuilt Mnemon memory CLI into the real home ~/.mnemon/bin.
          $ver = $env:MNEMON_VERSION
          $url = "https://github.com/mnemon-dev/mnemon/releases/download/v$ver/mnemon_${ver}_windows_amd64.zip"
          $tmpZip = Join-Path $env:RUNNER_TEMP 'mnemon.zip'
          Invoke-WebRequest -Uri $url -OutFile $tmpZip
          $tmpDir = Join-Path $env:RUNNER_TEMP 'mnemon-extract'
          if (Test-Path $tmpDir) { Remove-Item -Recurse -Force $tmpDir }
          Expand-Archive -Path $tmpZip -DestinationPath $tmpDir
          $mnemonExe = Get-ChildItem -Path $tmpDir -Recurse -Filter 'mnemon.exe' | Select-Object -First 1
          if (-not $mnemonExe) { throw 'mnemon.exe not found in the release asset' }
          $dest = Join-Path $env:USERPROFILE '.mnemon\bin'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Path $mnemonExe.FullName -Destination (Join-Path $dest 'mnemon.exe') -Force
          Write-Host "Staged mnemon.exe -> $dest"
      - name: Build Windows release package
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run package:win
      - name: Build unsigned Windows verification package
        if: github.event_name == 'pull_request'
        run: npm run package:win
      - name: Build isolated Windows development package
        if: github.event_name == 'workflow_dispatch'
        run: npm run package:dev:win
      - name: Smoke test packaged Windows Harness
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $userData = Join-Path $env:APPDATA 'dsh-desktop-dev'
          $logPath = Join-Path $userData 'logs\harness.log'
          $executable = 'dist-dev\win-unpacked\DSH Desktop Dev.exe'
          if (Test-Path $userData) { Remove-Item -Recurse -Force $userData }
          $desktop = Start-Process -FilePath $executable -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(75)
            $ready = $false
            while ((Get-Date) -lt $deadline) {
              if ($desktop.HasExited) {
                throw "DSH Desktop Dev exited before Harness was ready (exit code $($desktop.ExitCode))."
              }
              if (Test-Path $logPath) {
                $log = Get-Content -Raw $logPath
                $match = [regex]::Match($log, '\[desktop\] endpoint (http://127\.0\.0\.1:\d+)')
                if ($match.Success) {
                  try {
                    $response = Invoke-WebRequest -UseBasicParsing -Uri $match.Groups[1].Value -TimeoutSec 2
                    if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 500) {
                      Start-Sleep -Seconds 5
                      $stableLog = Get-Content -Raw $logPath
                      if ($stableLog -match '\[stderr\]') {
                        throw 'Harness reported stderr after HTTP became ready.'
                      }
                      if ($desktop.HasExited) {
                        throw "DSH Desktop Dev exited after Harness became ready (exit code $($desktop.ExitCode))."
                      }
                      $ready = $true
                      break
                    }
                  } catch { }
                }
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw 'Packaged Harness did not become ready within 75 seconds.' }
            Write-Host 'Packaged Windows Harness smoke test passed.'
          } finally {
            if (Test-Path $logPath) {
              Write-Host '--- harness.log ---'
              Get-Content $logPath
            }
            if (-not $desktop.HasExited) { Stop-Process -Id $desktop.Id -Force }
          }
      - name: Publish validated Windows development pre-release
        if: github.event_name == 'workflow_dispatch' && inputs.windows_prerelease_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE_TAG: ${{ inputs.windows_prerelease_tag }}
        run: |
          gh release create $env:PRERELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --prerelease `
            --title 'DSH Desktop Windows Harness Test' `
            --notes "Windows x64 development build for validating the Harness startup fix from PR #39. This build uses an isolated app identity and user data directory, and has passed the packaged Windows Harness smoke test." `
            'dist-dev/dsh-desktop-dev-windows-x64-setup.exe#DSH Desktop Dev Windows x64 Setup'
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: windows-x64
          path: |
            dist/dsh-desktop-windows-x64-setup.exe
            dist/dsh-desktop-windows-x64-setup.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: windows-x64-dev
          path: |
            dist-dev/dsh-desktop-dev-windows-x64-setup.exe
            dist-dev/dsh-desktop-dev-windows-x64-setup.exe.blockmap
            dist-dev/latest.yml
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.windows-x64.result == 'success'
    needs:
      - windows-x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "DSH Desktop $RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY"
          fi
