# Keep the stock directory-picker (auto) row active: the native backend
# serves ctx.directoryPicker, so host-side consumers (host.pickDirectory,
# plugins reading the seam) work unmodified. The client surface keeps its
# Electron-dialog bridge via the client-ui patch in patches/.
- insert:
    # DSH Desktop owns the fixed-target dsh-market installer and its lightweight
    # settings entry. After dshmarket is installed and Harness restarts, the
    # community plugin replaces the placeholder with its complete market UI.
    # Disabled 2026-08-17 at user's request; dependency removed from packaging
    # 2026-08-18 (the desktop-shell market entry / pnpm shim no longer ships).
    # Community dshmarket plugin is unaffected (it lives in the profile's own
    # dependencies).

# dsh-market normally offers to restart its own Node process after mutations.
# The desktop shell has the real lifecycle authority, so keep that behavior off
# whenever the optional plugin is present in the composed profile.
- id: dsh-market
  config:
    profile: web
    allowRestart: false
