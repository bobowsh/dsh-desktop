    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── WSL execution world (dsh-wsl-workspace variant) ─────────────────────
# The shell and fs services are provided entry-locally (the isolate
# realm); host services (tools registry, shell-env, jobs) fall through.
# tool-fs-search is intentionally absent: the packaged ripgrep runs on
# the Windows host and cannot open Linux paths; WSL sessions search with
# shell tools instead.
- id: wsl-world
  name: cordis:group
  group: true
  isolate:
    shell: true
    fs: true
  config:
    - id: shell-wsl
      name: 'E:/work/dsh-desktop-me/data/profiles/web/node_modules/dsh-wsl-workspace/lib/shell.js'
    - id: fs-wsl
      name: 'E:/work/dsh-desktop-me/data/profiles/web/node_modules/dsh-wsl-workspace/lib/fs.js'
    - id: tool-bash
      name: '@deepseek-ai/dsh-tool-bash'
    - id: tool-fs
      name: '@deepseek-ai/dsh-tool-fs'
