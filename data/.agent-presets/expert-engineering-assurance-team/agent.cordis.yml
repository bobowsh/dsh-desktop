      ## 测试金字塔
      
      ```
              /  E2E  \         少量，慢速，高置信度
             / 集成测试 \       适量，中速
            /   单元测试  \     大量，快速，聚焦
      ```
      
      ## 按组件类型制定策略
      
      - **API 端点**: 业务逻辑的单元测试，HTTP 层的集成测试，消费者的契约测试
      - **数据管道**: 输入验证，转换正确性，幂等性测试
