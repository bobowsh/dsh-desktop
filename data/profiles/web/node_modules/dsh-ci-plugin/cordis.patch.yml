# Cordis Plugin Configuration for dsh-ci

This file configures the DeepSeek Harness (DSH) Cordis plugin system for dsh-ci.

## Plugin Metadata

```yaml
plugin:
  id: dsh-ci
  name: "dsh-ci - Provider-neutral CI/CD for DeepSeek Harness"
  version: 0.1.0
  description: "Provides generic CI capabilities (list runs, jobs, failure evidence, bounded logs) with GitHub Actions provider."
  author: xxiaoxiong
  license: MIT
  repository: https://github.com/xxiaoxiong/dsh-ci
```

## Service Registration

```yaml
services:
  - id: ctx.ci
    type: service
    class: CIService
    provider: GitHubActionsProvider
    lifecycle: reversible
    inject:
      - credentialProvider
      - approvalGate
```

## Tool Registration

```yaml
tools:
  - name: ci_status
    description: "Get CI status for a repository/branch/commit"
    params:
      repository?: string
      branch?: string
      commit?: string
  - name: ci_runs
    description: "List workflow runs"
    params:
      repository?: string
      branch?: string
      status?: string
      limit?: number
  - name: ci_run
    description: "Get a single workflow run"
    params:
      runId: string
      repository?: string
  - name: ci_jobs
    description: "List jobs in a run"
    params:
      runId: string
      repository?: string
  - name: ci_failure
    description: "Extract bounded failure evidence with source references"
    params:
      runId: string
      jobId?: string
      repository?: string
  - name: ci_log
    description: "Get bounded log excerpt for a job or step"
    params:
      jobId?: string
      stepId?: string
      repository?: string
  - name: ci_artifacts
    description: "List artifacts for a run"
    params:
      runId: string
      repository?: string
  - name: ci_rerun
    description: "Rerun a workflow run (approval required)"
    params:
      runId: string
      dryRun: boolean
      repository?: string
  - name: ci_cancel
    description: "Cancel a workflow run (approval required)"
    params:
      runId: string
      repository?: string
```

## Credential Configuration

```yaml
credentials:
  - key: github.token
    env: GH_TOKEN
    aliases: [GITHUB_TOKEN]
    required: false
    note: "GitHub Personal Access Token (PAT) or GITHUB_TOKEN"
```

## Default Config

```yaml
config:
  writeEnabled: false
  defaultRepository: null
  maxLogSize: 8192
  maxEvidenceItems: 50
  secretPatterns:
    - type: generic-secret
      regex: "(?i)(password|passwd|secret|token|key|auth|credential)\\s*[:=]\\s*['\"]?[^\\s'\"]{8,}"
    - type: github-token
      regex: "ghp_[A-Za-z0-9]{36}"
    - type: ssh-key
      regex: "-----BEGIN (RSA |EC |DSA )?PRIVATE KEY-----"
    - type: aws
      regex: "AKIA[0-9A-Z]{16}"
```

## Lifecycle Hooks

```yaml
hooks:
  mount:
    - name: initializeCiService
      order: 10
  unmount:
    - name: cleanupCiService
      order: 10
      ensureCleaned: true
```
