packages:
  - .

nodeLinker: hoisted
minimumReleaseAge: 0
autoInstallPeers: false
# CI (GitHub Actions, pnpm v11) deny-by-default blocks build scripts of git-hosted
# and native deps unless explicitly allowed. This workspace only bundles the curated,
# version-pinned plugins declared in profiles/web/package.json, so we allow all build
# scripts here. Scoped to this plugin-bundling workspace only.
dangerouslyAllowAllBuilds: true
minimumReleaseAgeExclude:
  - dshmarket@1.2.4 || 1.4.0 || 1.4.1 || 1.5.0
  - '@anionex/dsh-vision-toolkit@0.1.7'
  - dsh-better-sidebar@0.12.1 || 0.12.2
  - dsh-vision-router@1.1.0 || 1.1.1
  - dsh-mnemon@0.1.4
  - '@a9i5k4/dsh-auto-memory@0.1.12'
  - '@liustack/modlens@3.16.7'
  - '@nanmicoder/dsh-agent-teams@0.1.5'
  - '@yejiming/dsh-gomoku@0.0.1'
  - dsh-client-auto-continue@0.5.2
  - dsh-context@0.7.3
  - dsh-pet@0.1.3
  - dsh-remote@0.5.4

# pnpm store: reuse the user home store (~/AppData/Local/pnpm/store).
# Explicit store-dir skips pnpm's default same-volume resolution (which would
# create a volume-root .pnpm-store next to the profile); cross-volume imports
# fall back to copy automatically.
storeDir: ~/AppData/Local/pnpm/store
